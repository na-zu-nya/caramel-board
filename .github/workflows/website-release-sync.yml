name: Website Release Sync

on:
  release:
    types:
      - published
      - edited

permissions:
  contents: read

jobs:
  dispatch:
    name: Trigger website release sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
      DISPATCH_REPO: ${{ secrets.WEBSITE_DISPATCH_REPO }}
      TAG_NAME: ${{ github.event.release.tag_name }}

    steps:
      - name: Send repository_dispatch to the website repository
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$DISPATCH_TOKEN" ] || [ -z "$DISPATCH_REPO" ]; then
            echo "::error::WEBSITE_DISPATCH_TOKEN / WEBSITE_DISPATCH_REPO secrets are not configured."
            exit 1
          fi

          payload=$(jq -n \
            --arg tag "$TAG_NAME" \
            '{event_type: "caramel-board-release", client_payload: {tag: $tag}}')

          curl --fail-with-body --show-error --silent \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -d "$payload" \
            "https://api.github.com/repos/${DISPATCH_REPO}/dispatches"
