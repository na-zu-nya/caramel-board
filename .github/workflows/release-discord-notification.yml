name: Release Discord Notification

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  notify-discord:
    name: Notify Discord
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG_NAME: ${{ inputs.tag }}

    steps:
      - name: Post release notification
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$DISCORD_RELEASE_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_RELEASE_WEBHOOK_URL secret is not configured."
            exit 1
          fi

          release_json=$(gh release view "$TAG_NAME" --json body,url)
          release_description=$(jq -r '.body // ""' <<<"$release_json")
          release_url=$(jq -r '.url' <<<"$release_json")
          repo_name="${GH_REPO##*/}"

          content=$(printf ">>> **%s [%s]** がリリースされました！\n%s\nURL: %s" \
            "$repo_name" \
            "$TAG_NAME" \
            "${release_description:-}" \
            "$release_url")
          payload=$(jq -n \
            --arg content "$content" \
            '{content: $content, allowed_mentions: {parse: []}}')

          curl --fail-with-body --show-error --silent \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            "$DISCORD_RELEASE_WEBHOOK_URL"
